<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>桌宠设置</title>
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-text">桌宠设置</span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-tab="assets" type="button">
          <span class="nav-label">动画素材</span>
          <span class="nav-count" data-count="assets"></span>
        </button>
        <button class="nav-item" data-tab="functions" type="button">
          <span class="nav-label">功能模块</span>
          <span class="nav-count" data-count="functions"></span>
        </button>
        <button class="nav-item" data-tab="system" type="button">
          <span class="nav-label">系统设置</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="save-state" id="saveState">修改自动保存</div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header" id="header"></header>
      <div class="main-body" id="body"></div>
      <footer class="main-footer" id="footer" hidden></footer>
    </main>
  </div>

  <div class="toast-stack" id="toasts"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
